name: 编译 YunX(城通增强版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 进入 yunx-ctfile 子目录编译 Debug APK
        run: |
          cd yunx-ctfile
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -40 || exit 1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yunx-ctfile-apk
          path: yunx-ctfile/app/build/outputs/**/*.apk
          retention-days: 30