name: 编译 YunX(城通增强版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 Debug APK
        run: |
          cd yunx-ctfile
          # 海外 runner 访问阿里云镜像会 502，注释掉镜像行，走官方源
          sed -i 's|^\s*maven { url = uri("https://maven.aliyun.com.*$||' settings.gradle.kts
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon > /tmp/build.log 2>&1 || true
          echo "===== 错误摘要 ====="
          grep -E '^e: |error:|BUILD (SUCCESSFUL|FAILED)|FAILURE: ' /tmp/build.log | head -50
          if grep -q 'BUILD SUCCESSFUL' /tmp/build.log; then exit 0; else exit 1; fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yunx-ctfile-apk
          path: yunx-ctfile/app/build/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: error