name: 云端编译安卓项目

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '项目 Git 地址（https 开头）'
        required: true
        type: string
      branch:
        description: '分支名（默认 main）'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        run: |
          BRANCH="${{ inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            git clone --depth 1 "${{ inputs.repo_url }}" project
          else
            git clone --depth 1 -b "$BRANCH" "${{ inputs.repo_url }}" project || git clone --depth 1 "${{ inputs.repo_url }}" project
          fi
          cd project
          git submodule update --init --recursive --depth 1 || true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 编译 APK
        run: |
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon || exit 1
          else
            echo "未找到 gradlew，下载官方 Gradle 8.7..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -P /tmp
            sudo unzip -qo /tmp/gradle-8.7-bin.zip -d /opt
            /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace || exit 1
          fi
          find . -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK 到 Artifacts（保留30天）
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: project/**/build/outputs/**/*.apk
          retention-days: 30