name: 云端编译安卓项目

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '项目 Git 地址（https 开头）'
        required: true
        type: string
      branch:
        description: '分支名（默认 main）'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        run: git clone --depth 1 -b "${{ inputs.branch || 'main' }}" "${{ inputs.repo_url }}" project

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 编译 APK
        run: |
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon || exit 1
          else
            echo "未找到 gradlew，尝试用系统 gradle..."
            sudo apt-get install -y -qq gradle || true
            gradle assembleDebug --no-daemon || exit 1
          fi
          find . -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK 到 Artifacts（保留30天）
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: project/**/build/outputs/**/*.apk
          retention-days: 30